<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ملفات العملاء">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ملفات العملاء</title>
<style>
:root{--card:#fff;--line:#e2e5ec;--field:#eceef3;--ink:#1d1f24;--muted:#8a8f9c;
--blue:#3b6fd8;--blue-soft:#eaf0fd;--green:#1f8a3b;--dark:#2f3542;--red:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f5f6fa,#eceef4);color:var(--ink);
font-family:"Segoe UI",Tahoma,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
padding:10px 20px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.85);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.topactions{display:flex;align-items:center;gap:8px;min-width:0}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 70px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.headtools{display:flex;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:220px;outline:none}
.search:focus{border-color:var(--blue)}
.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.ghost:hover{border-color:var(--green);color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;min-height:128px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
transition:transform .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,60,.08)}
.badge{font-size:11px;font-weight:600;color:var(--blue);min-height:14px}
.card .name{font-weight:700;font-size:14px;text-align:center;word-break:break-word}
.card .meta{font-size:12px;color:var(--muted)}
.empty,.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
.newbtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:30px auto 0;background:none;border:0;
cursor:pointer;color:#555;font-size:13px;font-weight:600}
.newbtn:hover{color:var(--blue)}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.title{flex:1;min-width:0;font-size:22px;font-weight:700;background:transparent;border:0;border-bottom:2px solid transparent;padding:4px 2px;outline:none}
.title:focus{border-bottom-color:var(--blue)}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.lbl{display:block;font-size:13px;font-weight:700;margin:0 0 8px}
.fld{width:100%;background:var(--field);border:1px solid #dfe2ea;border-radius:10px;padding:11px 12px;outline:none;
transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none;min-height:44px}
.fld:focus{border-color:var(--blue);background:#fff}
textarea.fld{resize:vertical;min-height:120px;line-height:1.7}
.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:12px;
border:1px solid var(--line);background:#fafbfc;cursor:pointer;font-weight:600;direction:ltr;text-align:left;transition:.15s}
.task .box{width:22px;height:22px;border-radius:6px;border:1.5px solid #c5cad5;flex:none;display:grid;place-items:center;background:#fff}
.task.on{border-color:var(--blue);background:var(--blue-soft)}
.task.on .box{background:var(--blue);border-color:var(--blue)}
.task.on .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;color:#fff;cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.dark{background:var(--dark)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue);width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.status{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.9;word-break:break-word}
.status b{color:var(--ink)}
.ok{color:var(--green);font-weight:700}
.del{display:block;margin:26px auto 0;background:none;border:0;color:var(--red);font-size:13px;cursor:pointer}
.login{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center}
.login .sheet{max-width:360px}
.login .logo{font-size:38px;text-align:center}
.login h2{text-align:center;margin:6px 0 20px}
.login .fld{margin-bottom:12px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(20,24,35,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.sheet h3{margin:0 0 14px}
.sheet .btns{display:flex;gap:10px;margin-top:16px}
.sheet .btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.sheet .btns .primary{background:var(--blue);border-color:var(--blue);color:#fff}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,30px);opacity:0;
background:#1f2430;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;transition:.25s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
@media (max-width:640px){
  .top{padding-left:14px;padding-right:14px}
  .wrap{padding:20px 14px 60px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .headtools{width:100%}
  .search{flex:1;width:auto}
  .tasks,.row3,.actions{grid-template-columns:1fr}
  .title{font-size:19px}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span>📐</span><span>ملفات العملاء</span></div>
  <div class="topactions" id="topactions"></div>
</div>
<div class="wrap" id="app"><div class="loading">جاري التحميل...</div></div>

<div class="modal" id="modal"><div class="sheet">
  <h3>ملف جديد</h3>
  <label class="lbl">اسم العميل</label>
  <input class="fld" id="newName" placeholder="مثال: فيلا أحمد البلوشي" autocomplete="off">
  <div class="btns"><button class="primary" id="newOk">إنشاء</button><button id="newCancel">إلغاء</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ إعدادات Firebase — الصق هنا إعدادات مشروعك ============ */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  projectId: "PASTE",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};
/* ===================================================================== */

const TASKS=["Site Plan","Floor Plan","Floor Layout Plan","Elevation","Sections","Interior Design","Detailing Drawings"];
const SOFTWARE=["AutoCAD","Revit","3ds Max","SketchUp","InDesign"];
const EXCEL="سجل العملاء.xlsx";
const canFS="showDirectoryPicker" in window;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const FOLDER=`<svg width="44" height="38" viewBox="0 0 44 38"><path d="M3 6a3 3 0 0 1 3-3h10l4 4h18a3 3 0 0 1 3 3v3H3z" fill="#7c828e"/><rect x="2" y="10" width="40" height="26" rx="3" fill="#969ca8"/><rect x="2" y="10" width="40" height="5" rx="2" fill="#a7adb8"/></svg>`;
const SMALL=`<svg width="22" height="19" viewBox="0 0 44 38"><path d="M3 6a3 3 0 0 1 3-3h10l4 4h18a3 3 0 0 1 3 3v3H3z" fill="#7c828e"/><rect x="2" y="10" width="40" height="26" rx="3" fill="#969ca8"/></svg>`;
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");
  clearTimeout(t._h);t._h=setTimeout(()=>t.className="toast",3800);}
function countTasks(n){return n===0?"لا توجد مهام":n===1?"مهمة واحدة":n===2?"مهمتان":n<=10?n+" مهام":n+" مهمة";}
const safeName=n=>(n||"").replace(/[<>:"/\\|?*\x00-\x1f]/g,"").trim().replace(/\.+$/,"")||"عميل بدون اسم";

let auth,db,user=null,clients=[],cur=null,saveT=null,unsub=null,dirName="";

/* ---------------- start ---------------- */
if(String(firebaseConfig.apiKey).startsWith("PASTE")){
  $("#app").innerHTML=`<div class="login"><div class="sheet"><div class="logo">⚙️</div><h2>باقي خطوة</h2>
  <p style="line-height:1.8;color:#555">لازم تلصق إعدادات مشروع Firebase داخل ملف <b>index.html</b> مكان كلمة PASTE. راجع ملف «دليل الإعداد».</p></div></div>`;
}else{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  onAuthStateChanged(auth,u=>{
    user=u;if(unsub){unsub();unsub=null;}clients=[];cur=null;
    renderTop();
    if(!u){renderLogin();return;}
    $("#app").innerHTML=`<div class="loading">جاري التحميل...</div>`;
    let first=true;
    unsub=onSnapshot(collection(db,"users",u.uid,"clients"),snap=>{
      let list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
      if(cur){
        const fresh=list.find(c=>c.id===cur.id);
        if(!fresh){clients=list;cur=null;location.hash="#/";return;}
        cur.folderCreated=fresh.folderCreated;cur.folderPath=fresh.folderPath;cur.inExcel=fresh.inExcel;
        clients=list.map(c=>c.id===cur.id?cur:c);renderStatus();
      }else{clients=list;route();}
      first=false;
    },err=>toast("تعذر تحميل البيانات: "+err.message,true));
  });
}
const clientsCol=()=>collection(db,"users",user.uid,"clients");
const clientDoc=id=>doc(db,"users",user.uid,"clients",id);

/* ---------------- top bar ---------------- */
async function renderTop(){
  const el=$("#topactions");
  if(!user){el.innerHTML="";return;}
  if(canFS){try{const h=await idbGet("dir");dirName=h?h.name:"";}catch{}}
  el.innerHTML=`${canFS?`<button class="chip" id="dirChip" title="المكان اللي تنشأ فيه مجلدات العملاء وملف الإكسل">📁 ${dirName?esc(dirName):"اختر مكان الحفظ"}</button>`:""}
    <button class="chip" id="logout">خروج</button>`;
  $("#logout").onclick=()=>{if(confirm("تسجيل الخروج؟"))signOut(auth);};
  if(canFS)$("#dirChip").onclick=async()=>{try{await pickDir();toast("تم اختيار مكان الحفظ: "+dirName);}catch(e){if(e.name!=="AbortError")toast(e.message,true);}};
}

/* ---------------- login ---------------- */
function renderLogin(){
  $("#app").innerHTML=`<div class="login"><div class="sheet">
    <div class="logo">📐</div><h2>ملفات العملاء</h2>
    <input class="fld" id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username" dir="ltr">
    <input class="fld" id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
    <button class="btn blue" id="go">دخول</button><div class="err" id="err"></div></div></div>`;
  const go=async()=>{
    const b=$("#go");b.disabled=true;$("#err").textContent="";
    try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);}
    catch(e){$("#err").textContent=/invalid|wrong|not-found|credential/.test(e.code||"")?"البريد أو كلمة المرور غير صحيحة":
      e.code==="auth/too-many-requests"?"محاولات كثيرة — انتظر قليلًا":"تعذر الدخول: "+(e.code||e.message);b.disabled=false;}
  };
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go();};
}

/* ---------------- page 1 : files ---------------- */
function renderHome(){
  cur=null;
  $("#app").innerHTML=`
  <div class="head">
    <div><h1>الملفات</h1><div class="sub">${clients.length} عميل</div></div>
    <div class="headtools">
      ${clients.length?`<input class="search" id="q" placeholder="بحث عن عميل..." autocomplete="off">`:""}
      ${clients.length?`<button class="ghost" id="dlAll">⬇ تحميل الإكسل</button>`:""}
    </div>
  </div>
  <div class="grid">
    ${clients.length?clients.map(c=>`
    <div class="card" data-id="${c.id}" data-name="${esc((c.name||"").toLowerCase())}">
      <div class="badge">${c.folderCreated?"📁 تم إنشاء المجلد":""}</div>
      ${FOLDER}
      <div class="name">${esc(c.name)}</div>
      <div class="meta">${countTasks((c.tasks||[]).length)}${c.inExcel?" · في الإكسل":""}</div>
    </div>`).join(""):`<div class="empty">لا يوجد عملاء بعد — اضغط «ملف جديد» لإضافة أول عميل</div>`}
  </div>
  <button class="newbtn" id="newBtn">${SMALL}<span>ملف جديد</span></button>`;
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>location.hash="#/c/"+el.dataset.id);
  $("#newBtn").onclick=openNew;
  const q=$("#q");
  if(q)q.oninput=()=>{const v=q.value.trim().toLowerCase();
    document.querySelectorAll(".card").forEach(el=>el.style.display=!v||el.dataset.name.includes(v)?"":"none");};
  if($("#dlAll"))$("#dlAll").onclick=()=>downloadAll().catch(e=>toast(e.message,true));
}
function openNew(){$("#newName").value="";$("#modal").classList.add("show");setTimeout(()=>$("#newName").focus(),50);}
function closeNew(){$("#modal").classList.remove("show");}
function createNew(){
  const name=$("#newName").value.trim();
  if(!name){$("#newName").focus();return;}
  const ref=doc(clientsCol());
  const c={name,brief:"",tasks:[],price:"",start:"",end:"",folderCreated:false,folderPath:"",inExcel:false,created:Date.now()};
  setDoc(ref,c).catch(e=>toast("لم يُحفظ: "+e.message,true));
  closeNew();location.hash="#/c/"+ref.id;
}
$("#newOk").onclick=createNew;
$("#newCancel").onclick=closeNew;
$("#newName").onkeydown=e=>{if(e.key==="Enter")createNew();if(e.key==="Escape")closeNew();};
$("#modal").onclick=e=>{if(e.target.id==="modal")closeNew();};

/* ---------------- page 2 : client ---------------- */
function renderClient(){
  const c=cur;
  $("#app").innerHTML=`
  <div class="bar">
    <button class="back" id="back">→ الملفات</button>
    <input class="title" id="f_name" value="${esc(c.name)}" placeholder="اسم العميل">
    <span class="saved" id="saved"></span>
  </div>
  <div class="panel">
    <label class="lbl">Brief</label>
    <textarea class="fld" id="f_brief" placeholder="وصف المشروع، الموقع، المساحة، متطلبات العميل...">${esc(c.brief)}</textarea>
  </div>
  <div class="panel">
    <label class="lbl">المهام المطلوبة</label>
    <div class="tasks">${TASKS.map(t=>`
      <button type="button" class="task${(c.tasks||[]).includes(t)?" on":""}" data-t="${t}"><span>${t}</span><span class="box"></span></button>`).join("")}
    </div>
  </div>
  <div class="panel"><div class="row3">
    <div><label class="lbl">السعر المتفق عليه (ر.ع)</label>
      <input class="fld" id="f_price" type="number" inputmode="decimal" min="0" step="any" value="${esc(c.price)}" placeholder="0"></div>
    <div><label class="lbl">بداية العمل</label><input class="fld" id="f_start" type="date" value="${esc(c.start)}"></div>
    <div><label class="lbl">المتوقع للانتهاء</label><input class="fld" id="f_end" type="date" value="${esc(c.end)}"></div>
  </div></div>
  <div class="actions">
    <button class="btn dark" id="mkFolder" ${canFS?"":"disabled"}>📁 إنشاء الملف</button>
    <button class="btn green" id="toExcel">${canFS?"＋ إضافة العميل":"⬇ إضافة العميل وتحميل الإكسل"}</button>
  </div>
  ${canFS?"":`<div class="hint">إنشاء المجلدات يتم من الكمبيوتر (Chrome أو Edge). من هنا تقدر تعبّي البيانات وتحمّل الإكسل.</div>`}
  <div class="status" id="status"></div>
  <button class="del" id="del">حذف العميل</button>`;

  const bind=(id,key)=>$(id).addEventListener("input",e=>{c[key]=e.target.value;schedule();});
  bind("#f_name","name");bind("#f_brief","brief");bind("#f_price","price");bind("#f_start","start");bind("#f_end","end");
  $("#f_end").addEventListener("change",checkDates);$("#f_start").addEventListener("change",checkDates);
  document.querySelectorAll(".task").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;c.tasks=c.tasks||[];
    c.tasks=c.tasks.includes(t)?c.tasks.filter(x=>x!==t):[...c.tasks,t];
    b.classList.toggle("on");schedule();});
  $("#back").onclick=()=>{flush();location.hash="#/";};
  $("#mkFolder").onclick=makeFolder;
  $("#toExcel").onclick=addExcel;
  $("#del").onclick=delClient;
  renderStatus();
}
function checkDates(){if(cur.start&&cur.end&&cur.end<cur.start)toast("تاريخ الانتهاء قبل تاريخ البداية — تأكد منه",true);}
function renderStatus(){
  const el=$("#status");if(!el||!cur)return;
  const c=cur,s=[];
  s.push(c.folderCreated?`<span class="ok">✓ المجلد:</span> <b>${esc(c.folderPath)}</b>`:"لم يُنشأ المجلد بعد");
  s.push(c.inExcel?`<span class="ok">✓ العميل مضاف في «${EXCEL}»</span> — اضغط «إضافة العميل» مرة أخرى لتحديث بياناته`:"لم يُضف إلى الإكسل بعد");
  el.innerHTML=s.join("<br>");
}
function schedule(){$("#saved").textContent="...";clearTimeout(saveT);saveT=setTimeout(save,500);}
function save(){
  saveT=null;const c=cur;if(!c)return;
  setDoc(clientDoc(c.id),{name:c.name,brief:c.brief||"",tasks:c.tasks||[],price:c.price||"",start:c.start||"",end:c.end||"",updated:Date.now()},{merge:true})
    .catch(e=>toast("لم يُحفظ: "+e.message,true));
  if($("#saved"))$("#saved").textContent="✓ محفوظ";
}
function flush(){if(saveT){clearTimeout(saveT);save();}}
function mark(fields){Object.assign(cur,fields);setDoc(clientDoc(cur.id),fields,{merge:true}).catch(e=>toast(e.message,true));renderStatus();}
async function busy(btn,fn){btn.disabled=true;try{await fn();}catch(e){if(e.name!=="AbortError")toast(e.message,true);}btn.disabled=false;}

function makeFolder(){busy($("#mkFolder"),async()=>{
  if(!cur.name.trim())throw new Error("اكتب اسم العميل أولًا");
  const dir=await getDir();flush();
  const name=safeName(cur.name);
  let existed=true;try{await dir.getDirectoryHandle(name);}catch{existed=false;}
  const root=await dir.getDirectoryHandle(name,{create:true});
  for(const s of SOFTWARE)await root.getDirectoryHandle(`${name} - ${s}`,{create:true});
  mark({folderCreated:true,folderPath:`${dir.name}\\${name}`});
  toast(existed?"المجلد موجود مسبقًا — تم التأكد من المجلدات الخمسة":`تم إنشاء المجلد في «${dir.name}» ✓`);
});}
function addExcel(){busy($("#toExcel"),async()=>{
  if(!cur.name.trim())throw new Error("اكتب اسم العميل أولًا");
  if(!canFS){flush();mark({inExcel:true});await downloadAll();toast("تم تحميل الإكسل بكل العملاء ✓");return;}
  const dir=await getDir();flush();
  const updated=await upsertExcelFile(dir,cur);
  mark({inExcel:true});
  toast(updated?"تم تحديث بيانات العميل في الإكسل ✓":"تمت إضافة العميل إلى الإكسل ✓");
});}
async function delClient(){
  if(!confirm(`حذف «${cur.name}»؟\n(لن يُحذف المجلد من الكمبيوتر ولا الصف من الإكسل)`))return;
  const id=cur.id;cur=null;clearTimeout(saveT);saveT=null;
  deleteDoc(clientDoc(id)).catch(e=>toast(e.message,true));
  location.hash="#/";
}

/* ---------------- routing ---------------- */
function route(){
  if(!user)return;
  const m=location.hash.match(/^#\/c\/(.+)$/);
  if(m){const c=clients.find(x=>x.id===m[1]);if(c){cur=c;renderClient();window.scrollTo(0,0);return;}}
  renderHome();
}
window.addEventListener("hashchange",()=>{cur=null;route();});

/* ---------------- folder access (Windows: Chrome / Edge) ---------------- */
function idb(mode,fn){return new Promise((res,rej)=>{
  const r=indexedDB.open("client-files",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{const tx=r.result.transaction("kv",mode);const q=fn(tx.objectStore("kv"));
    tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);};
  r.onerror=()=>rej(r.error);});}
const idbGet=k=>idb("readonly",s=>s.get(k));
const idbSet=(k,v)=>idb("readwrite",s=>s.put(v,k));
async function pickDir(){
  const h=await window.showDirectoryPicker({id:"client-files",mode:"readwrite",startIn:"desktop"});
  await idbSet("dir",h);dirName=h.name;
  const chip=$("#dirChip");if(chip)chip.textContent="📁 "+(h.name||"مكان الحفظ");
  return h;
}
async function getDir(){
  let h=null;try{h=await idbGet("dir");}catch{}
  if(h){
    if(await h.queryPermission({mode:"readwrite"})==="granted")return h;
    if(await h.requestPermission({mode:"readwrite"})==="granted")return h;
  }
  toast("اختر سطح المكتب (أو أي مجلد) لحفظ ملفات العملاء");
  return pickDir();
}

/* ---------------- Excel ---------------- */
const HEAD=["#","اسم العميل","Brief",...TASKS,"السعر المتفق عليه (ر.ع)","بداية العمل","المتوقع للانتهاء","مسار المجلد","تاريخ الإضافة","رقم العميل"];
const ID_COL=HEAD.length,PRICE_COL=4+TASKS.length;
const thin={style:"thin",color:{argb:"FFD9DCE3"}},BORDER={top:thin,left:thin,bottom:thin,right:thin};
function newSheet(wb){
  const ws=wb.addWorksheet("العملاء",{views:[{rightToLeft:true,state:"frozen",xSplit:2,ySplit:1}]});
  ws.addRow(HEAD);
  [5,22,45,...TASKS.map(()=>13),18,14,16,32,18,14].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const r=ws.getRow(1);r.height=32;
  r.eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF2F3542"}};
    c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=BORDER;});
  return ws;
}
const toDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")?new Date(Date.UTC(...s.split("-").map((n,i)=>i===1?n-1:+n))):(s||null);
const toPrice=s=>{const n=parseFloat(String(s??"").replace(/,/g,""));return isNaN(n)?(s||null):n;};
const fmtAdded=ms=>{const d=new Date(ms||Date.now()),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
function upsert(ws,c){
  let n=null;ws.eachRow((row,i)=>{if(i>1&&row.getCell(ID_COL).value===c.id)n=i;});
  const updated=n!==null;if(!updated)n=ws.rowCount+1;
  const row=ws.getRow(n);
  const added=updated?row.getCell(ID_COL-1).value:fmtAdded(c.created);
  const vals=[n-1,c.name,c.brief||"",...TASKS.map(t=>(c.tasks||[]).includes(t)?"✓":""),
    toPrice(c.price),toDate(c.start),toDate(c.end),c.folderPath||"",added,c.id];
  vals.forEach((v,i)=>{
    const cell=row.getCell(i+1),col=i+1,isTask=col>3&&col<=3+TASKS.length;
    cell.value=v===""?null:v;cell.border=BORDER;
    cell.alignment={vertical:"top",wrapText:col===3,horizontal:isTask||col===1?"center":undefined};
    cell.font=isTask&&v?{bold:true,color:{argb:"FF1F8A3B"}}:{};
    if(v instanceof Date)cell.numFmt="yyyy-mm-dd";
    if(col===PRICE_COL&&typeof v==="number")cell.numFmt="#,##0.000";
  });
  row.commit();return updated;
}
async function upsertExcelFile(dir,c){
  const wb=new ExcelJS.Workbook();let ws,fh;
  try{
    fh=await dir.getFileHandle(EXCEL);
    await wb.xlsx.load(await (await fh.getFile()).arrayBuffer());
    ws=wb.worksheets[0]||newSheet(wb);
  }catch(e){
    if(e.name==="NotReadableError")throw new Error("ملف الإكسل مفتوح حاليًا — أغلقه ثم حاول مرة أخرى");
    if(e.name!=="NotFoundError")throw e;
    fh=await dir.getFileHandle(EXCEL,{create:true});ws=newSheet(wb);
  }
  const updated=upsert(ws,c);
  const buf=await wb.xlsx.writeBuffer();
  try{const w=await fh.createWritable();await w.write(buf);await w.close();}
  catch(e){throw new Error(/NoModificationAllowed|InvalidState|NotReadable/.test(e.name)?
    "ملف الإكسل مفتوح حاليًا — أغلقه ثم حاول مرة أخرى":e.message);}
  return updated;
}
async function downloadAll(){
  flush();
  const wb=new ExcelJS.Workbook(),ws=newSheet(wb);
  [...clients].sort((a,b)=>(a.created||0)-(b.created||0)).forEach(c=>upsert(ws,c));
  const blob=new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=EXCEL;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
